plugins {
    id 'com.android.application'
}

android {
    namespace 'com.amirnourhan.goldbar'
    compileSdk 36

    defaultConfig {
        applicationId 'com.amirnourhan.goldbar'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        debug {
            assets.srcDir("$buildDir/generated/zarpulseAsset")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def zarPulseProject = rootProject.project(':zarpulse')

tasks.register('embedZarPulseApk', Copy) {
    dependsOn ':zarpulse:assembleDebug'
    from({
        zarPulseProject.fileTree("${zarPulseProject.buildDir}/outputs/apk/debug") {
            include '*.apk'
        }
    })
    into("$buildDir/generated/zarpulseAsset")
    rename { String ignored -> 'zarpulse.apk' }
}

tasks.configureEach { task ->
    if (task.name == 'mergeDebugAssets') {
        task.dependsOn 'embedZarPulseApk'
    }
}
