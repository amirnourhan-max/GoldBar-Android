name: Build and smoke-test Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify edited Excel business logic
        run: |
          rm -rf build/logic-test
          mkdir -p build/logic-test
          javac -d build/logic-test \
            app/src/main/java/com/amirnourhan/goldbar/GoldEntry.java \
            app/src/main/java/com/amirnourhan/goldbar/GoldCalculator.java \
            verify/Verify.java
          java -cp build/logic-test Verify

      - name: Verify v1.0.12 implementation
        run: |
          ! grep -q "buildGuideCard" app/src/main/java/com/amirnourhan/goldbar/MainActivity.java
          ! grep -q "inputGuide" app/src/main/java/com/amirnourhan/goldbar/MainActivity.java
          grep -q "WindowInsets.Type.ime" app/src/main/java/com/amirnourhan/goldbar/MainActivity.java
          grep -q "GOLD BAR (by:Amirnourhan)" app/src/main/java/com/amirnourhan/goldbar/MainActivityV106Fixed.java
          grep -q "4mirnourhan" app/src/main/java/com/amirnourhan/goldbar/MainActivityV106Fixed.java
          grep -q "محاسبه سریع" app/src/main/java/com/amirnourhan/goldbar/MainActivityV106Fixed.java
          grep -q "summary-after-alloy" app/src/main/java/com/amirnourhan/goldbar/MainActivityV107.java
          grep -q "clear-all-quick-button" app/src/main/java/com/amirnourhan/goldbar/MainActivityV108.java
          grep -q "compact one-page text report" app/src/main/java/com/amirnourhan/goldbar/MainActivityV109.java
          grep -q "class MainActivityV112" app/src/main/java/com/amirnourhan/goldbar/MainActivityV112.java
          grep -q "startDragAndDrop" app/src/main/java/com/amirnourhan/goldbar/MainActivityV112.java
          grep -q "section_order" app/src/main/java/com/amirnourhan/goldbar/MainActivityV112.java
          grep -q "draggable-section-" app/src/main/java/com/amirnourhan/goldbar/MainActivityV112.java
          grep -q "MainActivityV112" app/src/main/java/com/amirnourhan/goldbar/QuickCalcWidget.java
          grep -q "MainActivityV112" app/src/main/AndroidManifest.xml
          grep -q 'android:exported="true"' app/src/main/AndroidManifest.xml
          grep -q "quick_calc_widget_info" app/src/main/AndroidManifest.xml
          grep -q 'android:widgetCategory="home_screen"' app/src/main/res/xml/quick_calc_widget_info.xml
          ! grep -q 'previewLayout' app/src/main/res/xml/quick_calc_widget_info.xml
          ! grep -q '<Space' app/src/main/res/layout/widget_quick_calc.xml
          ! grep -q 'layout_weight' app/src/main/res/layout/widget_quick_calc.xml
          grep -q "widget_name" app/src/main/res/values/strings.xml
          grep -q 'windowSoftInputMode="adjustResize"' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/layout/widget_quick_calc.xml
          test -s app/src/main/res/xml/quick_calc_widget_info.xml

      - name: Build debug APK with official Android toolchain
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK archive
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator, widget registration and keyboard smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ci/emulator-smoke.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldBar-v1.0.12-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload smoke-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldBar-smoke-test-diagnostics-v112
          path: |
            build/appwidget-before.txt
            build/appwidget-after.txt
            build/query-receivers.txt
            build/package-widget.txt
            build/clear.xml
            build/lower.xml
            build/logcat-initial.txt
            build/logcat.txt
            build/start.xml
            build/tools.xml
            build/keyboard.xml
            build/keyboard.png
            build/input-method.txt
            build/report.xml
            build/package.txt
            build/pid-start.txt
            build/pid.txt
          if-no-files-found: ignore
          retention-days: 14
