name: Build and smoke-test Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Excel business logic
        run: |
          rm -rf build/logic-test
          mkdir -p build/logic-test
          javac -d build/logic-test \
            app/src/main/java/com/amirnourhan/goldbar/GoldEntry.java \
            app/src/main/java/com/amirnourhan/goldbar/GoldCalculator.java \
            verify/Verify.java
          java -cp build/logic-test Verify

      - name: Verify row UI was removed
        run: |
          ! grep -q "buildGuideCard" app/src/main/java/com/amirnourhan/goldbar/MainActivity.java
          ! grep -q "inputGuide" app/src/main/java/com/amirnourhan/goldbar/MainActivity.java
          grep -q "SOFT_INPUT_ADJUST_RESIZE" app/src/main/java/com/amirnourhan/goldbar/MainActivity.java
          grep -q 'windowSoftInputMode="adjustResize"' app/src/main/AndroidManifest.xml

      - name: Build debug APK with official Android toolchain
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK archive
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator startup and keyboard smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.amirnourhan.goldbar
            adb shell am start -W -n com.amirnourhan.goldbar/.MainActivity
            sleep 4
            adb shell uiautomator dump /sdcard/start.xml
            adb pull /sdcard/start.xml build/start.xml
            grep -q "GOLD BAR" build/start.xml
            ! grep -q "شماره راهنما" build/start.xml
            ! grep -q "ردیف / شماره راهنما" build/start.xml

            adb shell input swipe 520 1750 520 350 500
            adb shell input swipe 520 1750 520 350 500
            adb shell input swipe 520 1750 520 350 500
            sleep 2
            adb shell uiautomator dump /sdcard/tools.xml
            adb pull /sdcard/tools.xml build/tools.xml
            python3 - <<'PY'
            import re, xml.etree.ElementTree as ET
            root = ET.parse('build/tools.xml').getroot()
            node = next((n for n in root.iter('node') if n.attrib.get('content-desc') == 'quick-split-base'), None)
            if node is None:
                raise SystemExit('quick-split-base field not visible after scrolling')
            nums = list(map(int, re.findall(r'\d+', node.attrib['bounds'])))
            x = (nums[0] + nums[2]) // 2
            y = (nums[1] + nums[3]) // 2
            open('build/tap.sh', 'w').write(f'adb shell input tap {x} {y}\n')
            PY
            bash build/tap.sh
            sleep 2
            adb shell input text 812
            sleep 1
            adb shell uiautomator dump /sdcard/keyboard.xml
            adb pull /sdcard/keyboard.xml build/keyboard.xml
            grep -q 'content-desc="quick-split-base"' build/keyboard.xml

            adb logcat -d > build/logcat.txt
            adb shell pidof com.amirnourhan.goldbar | tr -d '\r' > build/pid.txt
            test -s build/pid.txt
            ! grep -E "FATAL EXCEPTION: main|Process: com\.amirnourhan\.goldbar" build/logcat.txt
            cat build/pid.txt

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldBar-v1.0.4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload smoke-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldBar-smoke-test-diagnostics-v104
          path: |
            build/logcat.txt
            build/start.xml
            build/tools.xml
            build/keyboard.xml
            build/pid.txt
          if-no-files-found: ignore
          retention-days: 14
