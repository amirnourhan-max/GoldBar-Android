name: Build and test Windows installer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate Gold Bar app icon
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File windows/GoldBar.Windows/GenerateIcon.ps1
          if (!(Test-Path windows/GoldBar.Windows/AppIcon.ico)) { throw 'App icon was not generated' }
          if ((Get-Item windows/GoldBar.Windows/AppIcon.ico).Length -lt 1000) { throw 'App icon is unexpectedly small' }

      - name: Verify gold calculation logic
        run: dotnet run --project windows/GoldBar.Verify/GoldBar.Verify.csproj -c Release

      - name: Verify Windows v1.5 implementation
        shell: pwsh
        run: |
          if (!(Select-String -Path windows/GoldBar.Windows/DesktopMainFormV2.cs -Pattern 'کل بار مورد نیاز' -Quiet)) { throw 'Total alloy metric missing' }
          if (!(Select-String -Path windows/GoldBar.Windows/DesktopMainFormV2.cs -Pattern 'ResizableCardPanel' -Quiet)) { throw 'Resizable cards missing' }
          if (!(Select-String -Path windows/GoldBar.Windows/DesktopMainFormV2.cs -Pattern 'SettingsDrawer' -Quiet)) { throw 'Integrated settings drawer missing' }
          if (!(Select-String -Path windows/GoldBar.Windows/DesktopMainFormV2.cs -Pattern 'Keys.Up' -Quiet)) { throw 'Up-arrow scale read missing' }
          if (!(Select-String -Path windows/GoldBar.Windows/SettingsDrawer.cs -Pattern 'StableSampleCount' -Quiet)) { throw 'Scale stability controls missing' }
          if (!(Select-String -Path windows/GoldBar.Windows/AppSettings.cs -Pattern 'AutoRead.*false' -Quiet)) { throw 'AutoRead default must be off' }
          if (!(Select-String -Path windows/GoldBar.Windows/ScaleReader.cs -Pattern 'IsStableSeries' -Quiet)) { throw 'Scale stability filter missing' }
          if (!(Select-String -Path windows/GoldBar.Windows/SplashForm.cs -Pattern 'در حال بارگذاری' -Quiet)) { throw 'Loading splash missing' }
          if (!(Select-String -Path windows/GoldBar.Windows/GoldBar.Windows.csproj -Pattern '<ApplicationIcon>AppIcon.ico</ApplicationIcon>' -Quiet)) { throw 'Executable icon missing' }
          if (!(Select-String -Path windows/installer/GoldBar.iss -Pattern 'GoldBar-Setup-v1.5.0' -Quiet)) { throw 'Installer v1.5.0 definition missing' }
          if (!(Select-String -Path windows/installer/GoldBar.iss -Pattern 'SetupIconFile' -Quiet)) { throw 'Installer icon missing' }

      - name: Build Windows desktop app
        run: dotnet build windows/GoldBar.Windows/GoldBar.Windows.csproj -c Release

      - name: Publish fast installed build
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build/windows-installed -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path build/windows-installed | Out-Null
          dotnet publish windows/GoldBar.Windows/GoldBar.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o build/windows-installed
          if (!(Test-Path build/windows-installed/GoldBar.exe)) { throw 'GoldBar.exe was not produced' }

      - name: Verify executable icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = (Resolve-Path build/windows-installed/GoldBar.exe).Path
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw 'No icon embedded in GoldBar.exe' }
          $bmp = $icon.ToBitmap()
          $bmp.Save((Join-Path (Resolve-Path build).Path 'ui-app-icon.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose(); $icon.Dispose()

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not available' }

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/installer | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' windows/installer/GoldBar.iss
          if (!(Test-Path build/installer/GoldBar-Setup-v1.5.0.exe)) { throw 'Installer was not produced' }

      - name: Silent install and complete self test
        shell: pwsh
        run: |
          $setup = (Resolve-Path build/installer/GoldBar-Setup-v1.5.0.exe).Path
          $testDir = Join-Path $env:TEMP 'GoldBar-v150-Test'
          Remove-Item -Recurse -Force $testDir -ErrorAction SilentlyContinue
          $install = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $testDir + '"') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with code $($install.ExitCode)" }
          $exe = Join-Path $testDir 'GoldBar.exe'
          if (!(Test-Path $exe)) { throw 'Installed GoldBar.exe not found' }

          $buildDir = (Resolve-Path build).Path
          $settingsFile = Join-Path $env:LOCALAPPDATA 'GoldBar\settings.json'
          Remove-Item $settingsFile -Force -ErrorAction SilentlyContinue

          # Scale filtering self test: noisy series rejected, stable series accepted.
          $env:GOLDBAR_SCALE_SELFTEST = '1'
          $env:GOLDBAR_SELFTEST_OUT = Join-Path $buildDir 'scale-selftest.txt'
          $p = Start-Process -FilePath $exe -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path $env:GOLDBAR_SELFTEST_OUT)) { throw 'Scale stability self test failed' }
          Remove-Item Env:GOLDBAR_SCALE_SELFTEST -ErrorAction SilentlyContinue
          Remove-Item Env:GOLDBAR_SELFTEST_OUT -ErrorAction SilentlyContinue

          # Settings save must persist the path but must not create that report directory.
          $env:GOLDBAR_SETTINGS_SELFTEST = '1'
          $env:GOLDBAR_SELFTEST_OUT = Join-Path $buildDir 'settings-selftest.txt'
          $p = Start-Process -FilePath $exe -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path $env:GOLDBAR_SELFTEST_OUT)) { throw 'Settings self test failed' }
          Remove-Item Env:GOLDBAR_SETTINGS_SELFTEST -ErrorAction SilentlyContinue
          Remove-Item Env:GOLDBAR_SELFTEST_OUT -ErrorAction SilentlyContinue
          Remove-Item $settingsFile -Force -ErrorAction SilentlyContinue

          # Full-size screenshots of every operator page, including integrated settings.
          $pages = @('dashboard','entries','calculations','quick','reports','settings')
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          foreach ($page in $pages) {
            $shot = Join-Path $buildDir ("ui-" + $page + ".png")
            $env:GOLDBAR_UI_PAGE = $page
            $env:GOLDBAR_UI_SIZE = '1540x900'
            $env:GOLDBAR_UI_SCREENSHOT = $shot
            $env:GOLDBAR_SCREENSHOT_EXIT = '1'
            $p = Start-Process -FilePath $exe -PassThru
            if (!$p.WaitForExit(16000)) { Stop-Process -Id $p.Id -Force; throw "Visual test timed out on $page" }
            if (!(Test-Path $shot)) { throw "Screenshot missing for $page" }
            if ((Get-Item $shot).Length -lt 25000) { throw "Screenshot too small for $page" }
          }

          # Compact-window checks catch clipped buttons/card content.
          foreach ($page in @('dashboard','entries','settings')) {
            $shot = Join-Path $buildDir ("ui-compact-" + $page + ".png")
            $env:GOLDBAR_UI_PAGE = $page
            $env:GOLDBAR_UI_SIZE = '1180x740'
            $env:GOLDBAR_UI_SCREENSHOT = $shot
            $p = Start-Process -FilePath $exe -PassThru
            if (!$p.WaitForExit(16000)) { Stop-Process -Id $p.Id -Force; throw "Compact visual test timed out on $page" }
            if (!(Test-Path $shot) -or (Get-Item $shot).Length -lt 20000) { throw "Compact screenshot failed for $page" }
          }
          $timer.Stop()
          "Installer + settings + scale stability + 9 visual checks PASS in $($timer.ElapsedMilliseconds) ms" | Out-File build/windows-metadata.txt

          Remove-Item Env:GOLDBAR_UI_PAGE -ErrorAction SilentlyContinue
          Remove-Item Env:GOLDBAR_UI_SIZE -ErrorAction SilentlyContinue
          Remove-Item Env:GOLDBAR_UI_SCREENSHOT -ErrorAction SilentlyContinue
          Remove-Item Env:GOLDBAR_SCREENSHOT_EXIT -ErrorAction SilentlyContinue

      - name: Record installer metadata
        shell: pwsh
        run: |
          Get-Item build/installer/GoldBar-Setup-v1.5.0.exe | Format-List Name,Length,VersionInfo | Out-File -Append build/windows-metadata.txt
          Get-FileHash build/installer/GoldBar-Setup-v1.5.0.exe -Algorithm SHA256 | Format-List | Out-File -Append build/windows-metadata.txt
          Get-Content build/windows-metadata.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: GoldBar-Windows-Setup-v1.5.0
          path: build/installer/GoldBar-Setup-v1.5.0.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldBar-Windows-v1.5.0-full-test
          path: |
            build/ui-*.png
            build/*selftest.txt
            build/windows-metadata.txt
          if-no-files-found: ignore
          retention-days: 14
