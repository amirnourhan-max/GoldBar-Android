name: Build Python CSS Windows installer fixed

on:
  push:
    branches: [ feature/windows-python-css-v160 ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goldbar-python-css-fixed-v160
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows/GoldBar.Python/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          pip install -r windows/GoldBar.Python/requirements.txt
          pip install pillow

      - name: Generate assets
        run: python windows/GoldBar.Python/generate_assets.py

      - name: Patch packaged runtime safely
        shell: pwsh
        run: |
          $p='windows/GoldBar.Python/app.py'
          $t=Get-Content $p -Raw
          $t=$t.Replace('allow_nan=False, default=lambda _: None','allow_nan=True')
          $t=$t.Replace('allow_nan=False','allow_nan=True')
          $t=$t.Replace('from PySide6.QtCore import QObject, QTimer, QUrl, Signal, Slot','from PySide6.QtCore import QObject, QTimer, QUrl, Signal, Slot, Qt')
          $t=$t.Replace('from PySide6.QtGui import QDesktopServices, QIcon','from PySide6.QtGui import QDesktopServices, QIcon, QColor')
          $t=$t.Replace('splash.showMessage("در حال بارگذاری…", 0x0084 | 0x0004, 0xFFF1C1)  # AlignCenter | AlignBottom','splash.showMessage("در حال بارگذاری…", Qt.AlignmentFlag.AlignHCenter | Qt.AlignmentFlag.AlignBottom, QColor("#fff1c1"))')
          Set-Content $p $t -Encoding utf8
          $j='windows/GoldBar.Python/web/app.js'
          $js=Get-Content $j -Raw
          $js=$js.Replace('JSON.parse(raw)',"JSON.parse(String(raw).replaceAll('NaN','null'))")
          Set-Content $j $js -Encoding utf8
          Add-Content windows/GoldBar.Python/web/style.css "`n.app-shell{direction:ltr!important}.sidebar,.main-area{direction:rtl!important}" -Encoding utf8

      - name: Core self test
        shell: pwsh
        run: |
          $env:GOLDBAR_PY_SELFTEST='1'
          python windows/GoldBar.Python/app.py
          if($LASTEXITCODE -ne 0){throw 'Core selftest failed'}
          Remove-Item Env:GOLDBAR_PY_SELFTEST

      - name: Build application folder
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build/python-installed,build/pyi-work -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force build/python-installed | Out-Null
          $web=(Resolve-Path windows/GoldBar.Python/web).Path
          $ico=(Resolve-Path windows/GoldBar.Python/AppIcon.ico).Path
          pyinstaller --noconfirm --clean --windowed `
            --name GoldBar `
            --icon "$ico" `
            --add-data "$web;web" `
            --add-data "$ico;." `
            --distpath build/python-installed `
            --workpath build/pyi-work `
            windows/GoldBar.Python/app.py
          if(!(Test-Path build/python-installed/GoldBar/GoldBar.exe)){throw 'GoldBar.exe missing'}
          if(!(Test-Path build/python-installed/GoldBar/_internal/PySide6/Qt/resources/qtwebengine_resources.pak) -and !(Get-ChildItem build/python-installed/GoldBar -Recurse -Filter 'qtwebengine_resources.pak' -ErrorAction SilentlyContinue)){throw 'Qt WebEngine resources missing'}

      - name: Verify executable icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $i=[System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path build/python-installed/GoldBar/GoldBar.exe).Path)
          if($null -eq $i){throw 'Icon missing'}
          $i.Dispose()

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(!(Test-Path $iscc)){choco install innosetup --no-progress -y}

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/python-installer | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' windows/GoldBar.Python/installer/GoldBar.iss
          if(!(Test-Path build/python-installer/GoldBar-Setup-v1.6.0.exe)){throw 'Setup missing'}

      - name: Install and capture real UI
        shell: pwsh
        run: |
          $setup=(Resolve-Path build/python-installer/GoldBar-Setup-v1.6.0.exe).Path
          $dir=Join-Path $env:TEMP 'GoldBar-v160-CSS-Test'
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          $p=Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="'+$dir+'"') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Install failed $($p.ExitCode)"}
          $exe=Join-Path $dir 'GoldBar.exe'
          if(!(Test-Path $exe)){throw 'Installed exe missing'}
          $shot=(Join-Path (Resolve-Path build).Path 'python-css-dashboard.png')
          $env:GOLDBAR_UI_SCREENSHOT=$shot
          $env:GOLDBAR_SCREENSHOT_EXIT='1'
          $proc=Start-Process $exe -PassThru
          $ok=$false
          for($i=0;$i -lt 90;$i++){
            Start-Sleep -Milliseconds 350
            if(Test-Path $shot){if((Get-Item $shot).Length -gt 35000){$ok=$true;break}}
            if($proc.HasExited -and !(Test-Path $shot)){break}
          }
          if(!$proc.HasExited){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}
          if(!$ok){throw 'Installed UI screenshot failed'}
          Remove-Item Env:GOLDBAR_UI_SCREENSHOT -ErrorAction SilentlyContinue
          Remove-Item Env:GOLDBAR_SCREENSHOT_EXIT -ErrorAction SilentlyContinue

      - name: Metadata
        shell: pwsh
        run: |
          "Python + HTML/CSS + installer + installed UI screenshot PASS" | Out-File build/python-css-metadata.txt
          Get-Item build/python-installer/GoldBar-Setup-v1.6.0.exe | Format-List Name,Length | Out-File -Append build/python-css-metadata.txt
          Get-FileHash build/python-installer/GoldBar-Setup-v1.6.0.exe -Algorithm SHA256 | Format-List | Out-File -Append build/python-css-metadata.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GoldBar-Python-CSS-Setup-v1.6.0
          path: build/python-installer/GoldBar-Setup-v1.6.0.exe
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GoldBar-Python-CSS-v1.6.0-visual
          path: |
            build/python-css-dashboard.png
            build/python-css-metadata.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish run id
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ci | Out-Null
          @"
          run_id=${{ github.run_id }}
          head_sha=${{ github.sha }}
          conclusion_hint=${{ job.status }}
          "@ | Set-Content .ci/python-css-fixed-latest.txt -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/python-css-fixed-latest.txt
          if(!(git diff --cached --quiet)){
            git commit -m 'Record fixed Python CSS build [skip ci]'
            git push origin HEAD:feature/windows-python-css-v160
          }
